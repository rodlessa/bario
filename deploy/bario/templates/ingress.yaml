{{- if .Values.ingress.enabled }}
{{- $fullname := include "bario.fullname" . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "bario.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: {{ include "bario.serviceName" (dict "root" . "component" "auth") }}
                port:
                  number: 8080
          - path: /api/posts
            pathType: Prefix
            backend:
              service:
                name: {{ include "bario.serviceName" (dict "root" . "component" "posts") }}
                port:
                  number: 8080
          - path: /api/uploads
            pathType: Prefix
            backend:
              service:
                name: {{ include "bario.serviceName" (dict "root" . "component" "uploads") }}
                port:
                  number: 8080
          - path: /api/follows
            pathType: Prefix
            backend:
              service:
                name: {{ include "bario.serviceName" (dict "root" . "component" "follows") }}
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "bario.serviceName" (dict "root" . "component" "frontend") }}
                port:
                  number: 80
{{- end }}
