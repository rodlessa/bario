{{- $fullname := include "bario.fullname" . -}}
{{- $name := printf "%s-uploads" $fullname -}}
{{- $svc := index .Values.services "uploads" -}}
{{- $postgresSecret := printf "%s-postgres" $fullname -}}
{{- $jwtSecret := printf "%s-jwt" $fullname -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-data
  labels:
    {{- include "bario.labels" . | nindent 4 }}
    app.kubernetes.io/component: uploads
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.uploads.storageClassName }}
  storageClassName: {{ .Values.uploads.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.uploads.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "bario.labels" . | nindent 4 }}
    app.kubernetes.io/component: uploads
spec:
  replicas: {{ $svc.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "bario.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: uploads
  template:
    metadata:
      labels:
        {{- include "bario.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: uploads
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: uploads
          image: "{{ $svc.image.repository }}:{{ $svc.image.tag }}"
          imagePullPolicy: {{ $svc.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          env:
            - name: HTTP_PORT
              value: "8080"
            - name: METRICS_PORT
              value: "9090"
            - name: UPLOAD_DIR
              value: /data/uploads
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $postgresSecret }}
                  key: password
            - name: DATABASE_URL
              value: {{ include "bario.databaseURL" . | quote }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $jwtSecret }}
                  key: jwt-secret
          volumeMounts:
            - name: data
              mountPath: /data/uploads
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ $name }}-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "bario.labels" . | nindent 4 }}
    app.kubernetes.io/component: uploads
spec:
  type: ClusterIP
  selector:
    {{- include "bario.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: uploads
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-metrics
  labels:
    {{- include "bario.labels" . | nindent 4 }}
    app.kubernetes.io/component: uploads-metrics
spec:
  type: ClusterIP
  selector:
    {{- include "bario.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: uploads
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
