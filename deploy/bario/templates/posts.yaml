{{- $fullname := include "bario.fullname" . -}}
{{- $name := printf "%s-posts" $fullname -}}
{{- $svc := index .Values.services "posts" -}}
{{- $postgresSecret := printf "%s-postgres" $fullname -}}
{{- $jwtSecret := printf "%s-jwt" $fullname -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "bario.labels" . | nindent 4 }}
    app.kubernetes.io/component: posts
spec:
  replicas: {{ $svc.replicas }}
  selector:
    matchLabels:
      {{- include "bario.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: posts
  template:
    metadata:
      labels:
        {{- include "bario.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: posts
      annotations:
        bario.dev/revision: {{ .Release.Revision | quote }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $svc.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $svc.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $svc.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: posts
          image: {{ include "bario.image" (dict "root" . "image" $svc.image) | quote }}
          imagePullPolicy: {{ $svc.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          env:
            - name: HTTP_PORT
              value: "8080"
            - name: METRICS_PORT
              value: "9090"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $postgresSecret }}
                  key: password
            - name: DATABASE_URL
              value: {{ include "bario.databaseURL" . | quote }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $jwtSecret }}
                  key: jwt-secret
            - name: AUTH_URL
              value: "http://{{ $fullname }}-auth:8080"
            - name: FOLLOWS_URL
              value: "http://{{ $fullname }}-follows:8080"
            - name: ADS_URL
              value: "http://{{ $fullname }}-ads:8087"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "bario.labels" . | nindent 4 }}
    app.kubernetes.io/component: posts
spec:
  type: ClusterIP
  selector:
    {{- include "bario.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: posts
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-metrics
  labels:
    {{- include "bario.labels" . | nindent 4 }}
    app.kubernetes.io/component: posts-metrics
spec:
  type: ClusterIP
  selector:
    {{- include "bario.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: posts
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
