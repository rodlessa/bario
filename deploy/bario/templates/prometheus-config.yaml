{{- $fullname := include "bario.fullname" . -}}
{{- $name := printf "%s-prometheus" $fullname -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "bario.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: {{ .Values.prometheus.scrapeInterval }}
      evaluation_interval: {{ .Values.prometheus.scrapeInterval }}
    scrape_configs:
      - job_name: bario-auth
        metrics_path: /metrics
        scheme: http
        static_configs:
          - targets:
              - "{{ include "bario.serviceName" (dict "root" . "component" "auth-metrics") }}:9090"
      - job_name: bario-posts
        metrics_path: /metrics
        scheme: http
        static_configs:
          - targets:
              - "{{ include "bario.serviceName" (dict "root" . "component" "posts-metrics") }}:9090"
      - job_name: bario-uploads
        metrics_path: /metrics
        scheme: http
        static_configs:
          - targets:
              - "{{ include "bario.serviceName" (dict "root" . "component" "uploads-metrics") }}:9090"
      - job_name: bario-follows
        metrics_path: /metrics
        scheme: http
        static_configs:
          - targets:
              - "{{ include "bario.serviceName" (dict "root" . "component" "follows-metrics") }}:9090"
      - job_name: bario-ads
        metrics_path: /metrics
        scheme: http
        static_configs:
          - targets:
              - "{{ include "bario.serviceName" (dict "root" . "component" "ads-metrics") }}:9097"
      - job_name: bario-moderation
        metrics_path: /metrics
        scheme: http
        static_configs:
          - targets:
              - "{{ include "bario.serviceName" (dict "root" . "component" "moderation-metrics") }}:9095"
      - job_name: bario-moderation-gore
        metrics_path: /metrics
        scheme: http
        static_configs:
          - targets:
              - "{{ include "bario.serviceName" (dict "root" . "component" "moderation-gore-metrics") }}:9096"
      - job_name: node-exporter
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - {{ .Release.Namespace }}
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: {{ include "bario.serviceName" (dict "root" . "component" "node-exporter") }}
            action: keep
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: metrics
            action: keep
          - source_labels: [__meta_kubernetes_endpoint_node_name]
            target_label: node
      - job_name: kube-state-metrics
        metrics_path: /metrics
        scheme: http
        static_configs:
          - targets:
              - "{{ include "bario.serviceName" (dict "root" . "component" "kube-state-metrics") }}:8080"
      - job_name: kubelet-cadvisor
        scheme: https
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          server_name: kubernetes.default.svc
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
