nameOverride: ""
fullnameOverride: ""

global:
  # Optional registry prefix applied to every image built from this chart
  # (the services.* images and the frontend). Leave empty to use the
  # repositories exactly as written below.
  # Example: 127.0.0.1:5000 -> 127.0.0.1:5000/bario/auth
  registry: ""

imagePullSecrets: []

# One entry per workload service. Most Go services expose :8080 (API) and
# :9090 (metrics); ads uses :8087/:9097 and the moderation sidecars use their
# own ports (8085/9095 and 8086/9096) as defined in their templates.
services:
  auth:
    replicas: 1
    image:
      repository: bario/auth
      tag: latest
      pullPolicy: IfNotPresent
    # Optional scheduling constraints; empty keeps the scheduler defaults.
    nodeSelector: {}
    affinity: {}
    tolerations: []
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 250m
        memory: 128Mi
  posts:
    replicas: 1
    image:
      repository: bario/posts
      tag: latest
      pullPolicy: IfNotPresent
    # Optional scheduling constraints; empty keeps the scheduler defaults.
    nodeSelector: {}
    affinity: {}
    tolerations: []
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 250m
        memory: 128Mi
  uploads:
    replicas: 1
    image:
      repository: bario/uploads
      tag: latest
      pullPolicy: IfNotPresent
    # Optional scheduling constraints; empty keeps the scheduler defaults.
    nodeSelector: {}
    affinity: {}
    tolerations: []
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 250m
        memory: 128Mi
  follows:
    replicas: 1
    image:
      repository: bario/follows
      tag: latest
      pullPolicy: IfNotPresent
    # Optional scheduling constraints; empty keeps the scheduler defaults.
    nodeSelector: {}
    affinity: {}
    tolerations: []
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 250m
        memory: 128Mi
  ads:
    replicas: 1
    image:
      repository: bario/ads
      tag: latest
      pullPolicy: IfNotPresent
    # Optional scheduling constraints; empty keeps the scheduler defaults.
    nodeSelector: {}
    affinity: {}
    tolerations: []
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 250m
        memory: 128Mi
  moderation:
    replicas: 1
    image:
      repository: bario/moderation
      tag: latest
      pullPolicy: IfNotPresent
    # Heavy service: on the Orange Pi cluster pin this to the master, e.g.
    # nodeSelector {node-type: heavy} plus a toleration for the control-plane taint.
    # Optional scheduling constraints; empty keeps the scheduler defaults.
    nodeSelector: {}
    affinity: {}
    tolerations: []
    # NSFWJS/tfjs-node: model weights are bundled in the image. The 1Gi limit
    # keeps the service schedulable on the 4Gi master.
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
  moderation-gore:
    replicas: 1
    image:
      repository: bario/moderation-gore
      tag: latest
      pullPolicy: IfNotPresent
    # Heavy service: on the Orange Pi cluster pin this to the master, e.g.
    # nodeSelector {node-type: heavy} plus a toleration for the control-plane taint.
    # Optional scheduling constraints; empty keeps the scheduler defaults.
    nodeSelector: {}
    affinity: {}
    tolerations: []
    # CLIP ViT-B/32 + CPU PyTorch; heavier than the NSFWJS sidecar. The 2Gi
    # limit keeps the service schedulable on the 4Gi master.
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 2Gi

frontend:
  replicas: 1
  image:
    repository: bario/frontend
    tag: latest
    pullPolicy: IfNotPresent
  # Optional scheduling constraints; empty keeps the scheduler defaults.
  nodeSelector: {}
  affinity: {}
  tolerations: []
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi

postgres:
  image:
    repository: postgres
    tag: "16-alpine"
  user: bario
  database: bario
  # Leave empty to let the chart generate a random password on first install.
  # The generated value is stored in the Kubernetes Secret and reused on upgrade.
  password: ""
  storage: 1Gi
  storageClassName: ""
  # postgres:16-alpine runs as uid/gid 70. Running the pod as that user makes
  # the entrypoint skip its su-exec step, which hangs under k3s. Only change
  # this if the image's postgres user changes.
  securityContext:
    runAsUser: 70
    runAsGroup: 70
    fsGroup: 70
  # Container-level security context. AppArmor signal mediation blocks
  # postgres from killing its own processes under k3s; running the container
  # unconfined lets it start. Pod-level uid/gid stay in securityContext above.
  containerSecurityContext:
    appArmorProfile:
      type: Unconfined
  # Heavy service: on the Orange Pi cluster pin this to the master with the
  # other stateful/heavy workloads. Optional; empty keeps the scheduler defaults.
  nodeSelector: {}
  affinity: {}
  tolerations: []
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

jwt:
  # Leave empty to generate a random shared secret on first install.
  # Alternatively pass an existing secret with --set jwt.secret=... .
  secret: ""

uploads:
  storage: 5Gi
  storageClassName: ""
  moderation:
    # Passed to the uploads service. The Go service defaults are the same,
    # but keeping them here makes the policy explicit and tunable.
    rejectThreshold: 0.7
    goreRejectThreshold: 0.7
    failOpen: false

ingress:
  enabled: true
  className: nginx
  annotations: {}
  host: bario.local

prometheus:
  image:
    repository: prom/prometheus
    tag: v2.54.1
  retention: 6h
  scrapeInterval: 15s
  # Optional scheduling constraints; empty keeps the scheduler defaults.
  nodeSelector: {}
  affinity: {}
  tolerations: []
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

grafana:
  replicas: 1
  image:
    repository: grafana/grafana
    tag: "11.3.0"
    pullPolicy: IfNotPresent
  adminUser: admin
  # Leave empty to let the chart generate a random password on first install.
  # The generated value is stored in the Kubernetes Secret and reused on upgrade.
  adminPassword: ""
  # Optional scheduling constraints; empty keeps the scheduler defaults.
  nodeSelector: {}
  affinity: {}
  tolerations: []
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
