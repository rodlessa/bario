{{- $fullname := include "chirp.fullname" . -}}
{{- $postgresSecret := printf "%s-postgres" $fullname -}}
{{- $jwtSecret := printf "%s-jwt" $fullname -}}
{{- $existingPostgres := lookup "v1" "Secret" .Release.Namespace $postgresSecret -}}
{{- $postgresPassword := .Values.postgres.password -}}
{{- if not $postgresPassword -}}
{{- if and $existingPostgres (hasKey $existingPostgres.data "password") -}}
{{- $postgresPassword = index $existingPostgres.data "password" | b64dec -}}
{{- else -}}
{{- $postgresPassword = randAlphaNum 32 -}}
{{- end -}}
{{- end -}}
{{- $existingJWT := lookup "v1" "Secret" .Release.Namespace $jwtSecret -}}
{{- $jwtSecretValue := .Values.jwt.secret -}}
{{- if not $jwtSecretValue -}}
{{- if and $existingJWT (hasKey $existingJWT.data "jwt-secret") -}}
{{- $jwtSecretValue = index $existingJWT.data "jwt-secret" | b64dec -}}
{{- else -}}
{{- $jwtSecretValue = randAlphaNum 48 -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $postgresSecret }}
  labels:
    {{- include "chirp.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
type: Opaque
data:
  password: {{ $postgresPassword | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $jwtSecret }}
  labels:
    {{- include "chirp.labels" . | nindent 4 }}
    app.kubernetes.io/component: auth
type: Opaque
data:
  jwt-secret: {{ $jwtSecretValue | b64enc | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-postgres
  labels:
    {{- include "chirp.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  clusterIP: None
  selector:
    {{- include "chirp.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $fullname }}-postgres-data
  labels:
    {{- include "chirp.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.postgres.storageClassName }}
  storageClassName: {{ .Values.postgres.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.postgres.storage }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}-postgres
  labels:
    {{- include "chirp.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ $fullname }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "chirp.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "chirp.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $postgresSecret }}
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ $fullname }}-postgres-data
